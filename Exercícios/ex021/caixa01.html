<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 { /* Box-Level */
            background-color: lightgray;
            height: 70px;
            width: 270px;
            border: 10px solid rgba(0, 0, 0, 0.3);
            padding: 10px;
            margin: 10px auto 10px auto;
            outline: 2px dashed rgb(112, 112, 112);
        }

        a {  /* Inline-level */
            border: 2px dashed rgb(9, 25, 145);
            padding: 3px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paragráfos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como isso funciona.</p>
</body>
</html>
