<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Milky Bun';
            src: url(fonts/Milky\ Bun.ttf);

            /*
            tipos de formatos format ()
            -opentype (otf)
            -truetype(ttf)
            -embedded-opentype 
            -treutype-aat (apple advanced typrography)
            -svg
            */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-family: 'Milky Bun', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Olá Mundo!</h1>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Quis quos mollitia corrupti ratione et incidunt explicabo beatae ex! Dolorem nobis illum quam veritatis id aspernatur esse maxime delectus. Rerum, id.</p>
</body>
</html>
