<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /* SELETORES PERSONALIZADOS
            - id: #
            - class: .
            - pseudo-class: :
            - pseudo-element: ::
            - children: >
        */

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: rgba(255, 0, 0, 0.9);
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: rgba(139, 0, 0, 0.9);
        }

        a:hover {
            color: black;
            text-decoration: underline;
        }

        a:active {
            color: rgba(170, 45, 45, 0.9);
        }

        .especial {
            background-color: rgba(255, 221, 0, 0.9);
            border-radius: 20px;
        }

        .especial::before {
            content: '⇒ ';
            text-decoration: none;
            font-weight: normal;
            color: rgba(181, 181, 181, 0.9);
        }

        .especial::after {
            content: ' ⇐';
            text-decoration: none;
            font-weight: normal;
            color: rgba(181, 181, 181, 0.9);
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositório GitHub</a></li>
        <li><a href="https://www.youtube.com/@cursoemvideo" target="_blank" class="especial">Canal do Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com/" target="_blank">Site do Curso em Video</a></li>
    </ul>
</body>
</html>
